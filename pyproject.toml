[project]
name = "autonomous-docx-agent"
version = "0.1.0"
description = "Autonomous AI Agent generating Word documents via FastAPI using Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "python-docx>=1.1.2",
    "google-generativeai>=0.7.0",
    "python-multipart>=0.0.9",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
